<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="IMG-20260828-WA3179.jpg">
<link rel="apple-touch-icon" href="IMG-20260828-WA3179.jpg">
<title>Foto a Texto</title>
<style>
body{font-family:system-ui;background:#0f172a;color:white;text-align:center;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:16px;margin-top:20px}
button{background:#22c55e;border:0;padding:12px 20px;border-radius:10px;font-weight:bold;color:black;margin:5px}
textarea{width:100%;height:200px;border-radius:10px;padding:10px;margin-top:10px}
input{margin:15px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<h2>📸 Foto a Texto</h2>
<p>Toma foto a tus apuntes y cópialos</p>
<div class="card">
<input type="file" id="foto" accept="image/*" capture="camera">
<div id="estado"></div>
<textarea id="texto" placeholder="Aquí aparecerá el texto..."></textarea><br>
<button onclick="copiar()">Copiar texto</button>
</div>
<script>
const foto=document.getElementById('foto');
const texto=document.getElementById('texto');
const estado=document.getElementById('estado');
foto.onchange=async(e)=>{
 const file=e.target.files[0];
 if(!file)return;
 estado.innerText="⏳ Leyendo... espera";
 const {data:{text}}=await Tesseract.recognize(file,'spa+eng');
 texto.value=text;
 estado.innerText="✅ Listo";
}
function copiar(){texto.select();document.execCommand('copy');alert('Copiado!')}
</script>
</body>
</html>
